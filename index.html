<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>손절 계산기 — 우리 사이, 아직 괜찮은 걸까?</title>
<meta name="description" content="친구 이름만 넣으면 나오는 우리 사이 손절 위험도. 결과에 대한 책임은 지지 않습니다.">
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<style>
/* ===================== 토큰 ===================== */
:root{
  --point:#FF00A8;              /* 포인트 컬러 1개 : 촌스러운 네온 마젠타 */
  --point-ink:#FFFFFF;          /* 포인트 컬러 위에 올라가는 글자색 */
  --point-tint:rgba(255,0,168,.10);
  --point-glow:rgba(255,0,168,.55);
  --ink:#22222E;
  --ink-sub:#7A7A8C;
  --card:#FFFFFF;
  --bg:#FFFFFF;             /* 배경 : 흰색 */
  --radius:22px;
  --pad:26px;
  /* 2000년대 시스템 폰트 3종 */
  --f-gung:'궁서','궁서체',Gungsuh,GungsuhChe,Batang,BatangChe,serif;
  --f-gulim:'굴림','굴림체',Gulim,GulimChe,'돋움',Dotum,sans-serif;
  --f-gothic:'HY견고딕','HYGothic-Extra','맑은 고딕','Malgun Gothic','돋움',Dotum,sans-serif;
  --f-bhs:'Black Han Sans',var(--f-gothic);
  /* 질문·선택지 전용 : 가독성 */
  --f-read:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,
           'Apple SD Gothic Neo','맑은 고딕','Malgun Gothic',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:Pretendard,'Pretendard Variable',-apple-system,BlinkMacSystemFont,
              'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  color:var(--ink);
  background:#d7d7dc;                 /* 카드 바깥 회색 (PC·모바일 공통) */
  display:flex;align-items:center;justify-content:center;
  padding:14px;
  -webkit-font-smoothing:antialiased;
  word-break:keep-all;
}

/* 앱 셸 : PC·모바일 모두 흰색 둥근 카드 (내용은 예전 그대로) */
#app{
  position:relative;z-index:1;
  width:100%;max-width:430px;min-width:0;
  height:100%;max-height:844px;
  background:var(--bg);
  border-radius:30px;
  box-shadow:0 24px 55px -18px rgba(30,25,60,.4);
  overflow:hidden;
  display:flex;flex-direction:column;
}
.screen{
  position:relative;z-index:1;
  flex:1;min-height:0;display:none;flex-direction:column;
  padding:34px var(--pad) calc(24px + env(safe-area-inset-bottom));
}
.screen.active{display:flex;}

/* =========================================================
   짤방 공용 : 외곽선 / 워드아트 / 데코 / 말풍선 / 버튼
   ========================================================= */
/* 검정 3px + 흰색 6px + 아래 진한 그림자 */
.ol{
  text-shadow:
    -3px 0 0 #14141F, 3px 0 0 #14141F, 0 -3px 0 #14141F, 0 3px 0 #14141F,
    -2px -2px 0 #14141F, 2px -2px 0 #14141F, -2px 2px 0 #14141F, 2px 2px 0 #14141F,
    -6px 0 0 #fff, 6px 0 0 #fff, 0 -6px 0 #fff, 0 6px 0 #fff,
    -5px -5px 0 #fff, 5px -5px 0 #fff, -5px 5px 0 #fff, 5px 5px 0 #fff,
    0 9px 0 rgba(0,0,0,.30);
}
/* 워드아트 : 바깥 외곽선 + 안쪽 원색 외곽선 + 그라데이션 채움 (3겹)
   --ol1/--w1 = 바깥선, --ol2/--w2 = 안쪽선, --fill = 채움 */
.wa{
  --ol1:#fff; --w1:11px;
  --ol2:#14141F; --w2:5px;
  --fill:linear-gradient(180deg,#fff,#ddd);
  --sh:rgba(0,0,0,.34);
  position:relative;display:inline-block;white-space:nowrap;
  font-family:var(--f-gothic);font-weight:800;line-height:1.12;
  color:var(--ol1);-webkit-text-stroke:var(--w1) var(--ol1);paint-order:stroke fill;
  filter:drop-shadow(0 6px 0 var(--sh)) drop-shadow(0 11px 9px rgba(0,0,0,.25));
}
.wa::before,.wa::after{
  content:attr(data-text);position:absolute;left:0;top:0;width:100%;
}
.wa::before{-webkit-text-stroke:var(--w2) var(--ol2);-webkit-text-fill-color:transparent;color:transparent;}
.wa::after{
  -webkit-text-stroke:0;background-image:var(--fill);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
/* 배경 데코 (보케·하트·반짝이) — 텍스트 위에 겹쳐도 opacity .3 이하 */
.deco{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.deco .bokeh{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.95),rgba(255,255,255,.35) 55%,rgba(255,255,255,0) 72%);
}
/* CSS로 그린 납작한 하트 */
.deco .heart{position:absolute;width:var(--s);height:var(--s);background:var(--c);transform:rotate(-45deg) scale(1);}
.deco .heart::before,.deco .heart::after{content:'';position:absolute;width:100%;height:100%;background:inherit;border-radius:50%;}
.deco .heart::before{top:-50%;left:0;}
.deco .heart::after{top:0;left:50%;}
.deco .spark{position:absolute;line-height:1;animation:twinkle 2.6s infinite ease-in-out;}
@keyframes twinkle{0%,100%{opacity:var(--o);transform:scale(1) rotate(var(--r))}50%{opacity:calc(var(--o) * .35);transform:scale(.84) rotate(var(--r))}}
@keyframes heartbeat{0%,100%{opacity:var(--o)}50%{opacity:calc(var(--o) * .55)}}

/* 말풍선 — 글씨를 가리지 않도록 레이아웃에 자리를 차지시킨다 */
.bubbles{
  display:flex;justify-content:flex-start;align-items:flex-end;
  gap:8px;margin-bottom:10px;padding-left:6px;
}
.bubble{
  position:relative;z-index:3;
  font-family:var(--f-gulim);font-weight:700;font-size:15px;line-height:1.15;color:#14141F;
  background:#fff;border:3px solid #14141F;
  padding:9px 15px 10px;box-shadow:4px 5px 0 rgba(0,0,0,.32);white-space:nowrap;
}
/* 각진 말풍선 (오른쪽) */
.bubble.b-r{border-radius:18px;transform:rotate(-5deg) translateY(-10px);}
.bubble.b-r::after{
  content:'';position:absolute;bottom:-13px;left:26px;width:14px;height:14px;
  background:#fff;border-right:3px solid #14141F;border-bottom:3px solid #14141F;
  transform:rotate(45deg);
}
/* 구름형 생각풍선 (왼쪽) — 꼬리에 작은 동그라미 두 개 */
.bubble.b-l{border-radius:50%/42%;padding:12px 17px;transform:rotate(-5deg);}
.bubble.b-l::before,.bubble.b-l::after{
  content:'';position:absolute;background:#fff;border:3px solid #14141F;border-radius:50%;
}
.bubble.b-l::before{width:15px;height:15px;bottom:-13px;left:22px;}
.bubble.b-l::after{width:9px;height:9px;bottom:-24px;left:12px;}

/* 짤 : 글씨 뒤. 현수막(.hero-tag) 아래에서 시작해 잘린 윗변이 가려진다 */
.meme{
  position:absolute;left:64%;top:-32px;z-index:-1;
  width:152%;max-width:none;
  transform:translateX(-50%) rotate(-4deg);
  opacity:.55;pointer-events:none;
  filter:drop-shadow(0 6px 0 rgba(255,255,255,.55));
}

/* 누끼 이미지 자리 (없으면 사라짐, 레이아웃 영향 없음) */
.cutout{
  position:absolute;bottom:0;z-index:2;width:150px;height:auto;pointer-events:none;
  filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff)
         drop-shadow(0 -2px 0 #fff) drop-shadow(4px 6px 5px rgba(0,0,0,.45));
}
.cutout.cut-l{left:-16px;transform:rotate(-3deg);}
.cutout.cut-r{right:-16px;transform:rotate(4deg);}

/* 입체 베벨 버튼 */
.btn{
  width:100%;height:66px;cursor:pointer;
  font-family:var(--f-gothic);font-weight:800;font-size:24px;letter-spacing:-.01em;
  color:#fff;background:linear-gradient(180deg,#FF3D8B 0%,#E4006C 100%);
  border:3px solid #14141F;border-radius:16px;
  box-shadow:0 7px 0 #8E0043, 0 9px 0 #14141F, 0 14px 16px rgba(0,0,0,.28);
  text-shadow:0 2px 0 rgba(0,0,0,.45);
  transition:transform .08s ease, box-shadow .08s ease;
}
.btn:active{transform:translateY(7px);box-shadow:0 0 0 #8E0043, 0 2px 0 #14141F, 0 3px 6px rgba(0,0,0,.3);}

/* ===================== 랜딩 : 흰 배경 · 검정 궁서체 ===================== */
#screen-landing{
  --bg-screen:#FFFFFF;--bg-back:#FFFFFF;
  background:#fff;
  font-family:var(--f-gung);color:#111;
  padding-top:30px;
}
#screen-quiz,#screen-loading,#screen-result{
  --bg-screen:#FFFFFF;--bg-back:#FFFFFF;background:var(--bg-screen);
}
.hero{
  flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;
}
.hero-tag{
  font-family:var(--f-gulim);font-weight:700;font-size:18px;color:#111;margin-bottom:22px;
}

/* 타이틀 : 궁서체, 검정, 두 줄 */
h1.title{display:flex;flex-direction:column;align-items:center;line-height:1.02;}
.title .t1{font-family:var(--f-gung);font-weight:700;font-size:clamp(78px,25vw,108px);}
.title .t2{font-family:var(--f-gung);font-weight:700;font-size:clamp(78px,25vw,108px);margin-top:4px;}

.land-img{
  position:relative;z-index:2;
  display:block;width:210px;height:auto;
  margin:6px auto -70px;              /* 아래로 겹치도록 당김 */
  transform:translate(70px,26px);     /* 오른쪽 아래로 */
}
.sub{
  position:relative;z-index:1;        /* 이미지 뒤 */
  margin-top:0;font-family:var(--f-gulim);font-size:22px;line-height:1.5;color:#111;
  transform:translate(-50px,-78px);   /* 왼쪽 위로 */
}

/* 입력 + 버튼 */
.enter{
  display:flex;flex-direction:column;gap:12px;
  margin-bottom:clamp(6px,9vh,64px);
}
.name-input{
  width:100%;height:60px;
  border:2px solid #111;border-radius:10px;background:#fff;
  font-family:var(--f-gulim);font-size:19px;color:#111;
  text-align:center;outline:none;
}
.name-input::placeholder{color:#AAA;}
.name-input:focus{border-color:#111;}
/* 시작 버튼도 흰 배경 · 검정 궁서체 (다른 화면 .btn은 그대로) */
#screen-landing .btn{
  height:60px;
  font-family:var(--f-gulim);font-weight:700;font-size:21px;letter-spacing:0;
  color:#fff;background:#111;
  border:2px solid #111;border-radius:10px;
  box-shadow:none;text-shadow:none;
  transition:opacity .1s ease, transform .08s ease;
}
#screen-landing .btn:active{transform:scale(.99);box-shadow:none;opacity:.85;}
.disclaimer{
  margin-top:14px;text-align:center;
  font-family:var(--f-gulim);font-size:13px;color:#888;
}

/* ===================== 질문 화면 =====================
   랜딩과 동일 : 흰 배경 · 검정 · 굴림. 장식 없음. */
#screen-quiz{
  --bg-screen:#FFFFFF;--bg-back:#FFFFFF;
  --q-ink:#111;
  background:var(--bg-screen);
  padding:22px var(--pad) calc(20px + env(safe-area-inset-bottom));
}

/* 진행바 */
.q-head{flex:none;}
.q-count{
  display:flex;align-items:baseline;gap:3px;margin-bottom:10px;
  font-family:var(--f-gulim);font-weight:700;font-size:15px;color:#999;
}
.q-count b{font-size:15px;font-weight:700;color:#111;}
.q-bar{width:100%;height:8px;border-radius:99px;background:#EAEAEA;overflow:hidden;}
.q-bar i{
  display:block;height:100%;width:0;border-radius:99px;background:#111;
  transition:width .35s cubic-bezier(.34,1.2,.44,1);
}

/* 전환 스테이지 : 질문 + 선택지가 함께 슬라이드 */
.q-stage{
  flex:1;min-height:0;display:flex;flex-direction:column;
  transition:opacity .15s ease, transform .15s ease;
}
.q-stage.is-out{opacity:0;transform:translateX(-16px);}
.q-stage.is-in{opacity:0;transform:translateX(16px);transition:none;}

/* 질문 : 배경 위에 직접, 상단을 채운다 */
.q-body{
  flex:0 0 26%;min-height:0;display:flex;align-items:flex-start;
  padding:20px 0 12px;
}
.q-text{
  font-family:var(--f-gung);font-weight:700;
  font-size:28px;line-height:1.45;letter-spacing:-.02em;color:var(--q-ink);
  word-break:keep-all;                 /* 단어 중간에서 안 끊김 */
  text-wrap:balance;                   /* 줄 길이 균형 (자연스러운 줄바꿈) */
}
.q-text .nm{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px;}

/* 선택지 : 하단 절반을 채운다 */
.opts{
  flex:1;min-height:0;list-style:none;
  display:flex;flex-direction:column;justify-content:flex-start;gap:12px;
}
.opt{
  flex:0 0 auto;height:58px;
  display:flex;align-items:center;
  padding:0 22px;border-radius:10px;
  background:#fff;border:2px solid #111;
  font-family:var(--f-gulim);
  font-size:18px;font-weight:700;line-height:1.3;letter-spacing:-.02em;
  color:#111;cursor:pointer;
  transition:background .1s ease, color .1s ease, transform .08s ease;
}
@media (hover:hover){ .opt:hover{background:#F4F4F4;} }
.opt:active{transform:scale(.99);}
.opt.sel{background:#111;border-color:#111;color:#fff;}

/* ===================== 로딩 ===================== */
#screen-loading{
  align-items:center;justify-content:center;text-align:center;
  --bg-screen:#FFFFFF;--bg-back:#FFFFFF;
  background:var(--bg-screen);
}
.load-dots{display:flex;gap:10px;justify-content:center;margin-bottom:24px;}
.load-dots i{
  width:11px;height:11px;border-radius:50%;
  background:#111;
  animation:blink 1.1s infinite ease-in-out;
}
.load-dots i:nth-child(2){animation-delay:.16s;}
.load-dots i:nth-child(3){animation-delay:.32s;}
@keyframes blink{0%,60%,100%{opacity:.2;transform:translateY(0)}30%{opacity:1;transform:translateY(-5px)}}

/* 문구 한 줄만 보이고 교체 */
.load-text{
  min-height:60px;display:flex;align-items:center;justify-content:center;
  font-family:var(--f-gulim);font-weight:700;font-size:22px;
  line-height:1.4;letter-spacing:-.02em;color:#111;
  transition:opacity .16s ease, transform .16s ease;
}
.load-text.is-out{opacity:0;transform:translateY(-8px);}
.load-text.is-in{opacity:0;transform:translateY(8px);transition:none;}
.load-text .nm{text-decoration:underline;text-underline-offset:3px;}
.load-text.last{font-size:22px;}

/* ===================== 결과 ===================== */
#screen-result{
  padding-top:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));
  --bg-screen:#FFFFFF;--bg-back:#FFFFFF;
  background:var(--bg-screen);
}

/* 카드 무대 : 남는 높이에 9:16 카드를 꽉 채움 */
.r-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;}

/* ★ 캡처 영역 — 버튼은 이 밖에 있다. 흰 배경 · 검정 · 굴림/궁서 */
#result-card{
  position:relative;
  height:100%;width:auto;aspect-ratio:9/16;max-width:100%;
  border:2px solid #111;border-radius:14px;overflow:hidden;
  background:#fff;
  container-type:size;                 /* 내부 요소를 카드 크기 기준으로 스케일 */
  display:flex;flex-direction:column;align-items:center;
  text-align:center;padding:22px 20px;
}

/* 상단 헤더 : 브랜드 */
.r-top{
  flex:none;width:100%;
  display:flex;align-items:baseline;justify-content:center;gap:9px;
}
.r-brand{font-family:var(--f-gung);font-weight:700;font-size:21px;color:#111;}
.r-mark{font-family:var(--f-gulim);font-weight:700;font-size:13px;letter-spacing:.02em;color:#AAA;}

/* 본문 : 짤(위·유동) + 텍스트(아래·고정). 넘침 방지로 clip */
.r-body{
  flex:1;min-height:0;width:100%;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}

/* 짤 슬롯 : 남는 공간만 차지하고, 부족하면 0까지 줄어든다.
   이미지는 슬롯을 100% 넘지 못하므로 절대 다른 요소를 밀거나 겹치지 않음 */
.r-mid{
  flex:1 1 0;min-height:0;max-height:34cqh;width:100%;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.r-mid:not(:empty){margin-bottom:3cqh;}
.r-meme{
  display:block;max-width:82%;max-height:100%;width:auto;height:auto;
  object-fit:contain;border-radius:8px;
}

/* 결과 텍스트 그룹 : 카드 크기에 맞춰 스케일 → 어떤 높이에서도 안 넘침 */
.r-in{flex:none;display:flex;flex-direction:column;align-items:center;width:100%;}

.r-label{
  font-family:var(--f-gulim);font-weight:700;
  font-size:clamp(15px,4.4cqh,20px);color:#111;
}
.r-label .nm{text-decoration:underline;text-underline-offset:3px;}

/* '손절 위험도' 라벨 */
.r-kicker{
  margin-top:1.7cqh;padding:0.5em 1.1em 0.6em;
  font-family:var(--f-gulim);font-weight:700;
  font-size:clamp(14px,4cqh,18px);color:#fff;
  background:#111;border-radius:999px;letter-spacing:.02em;
}
.r-num{
  margin-top:1.5cqh;
  font-family:var(--f-gung);font-weight:700;
  font-size:clamp(56px,17cqh,118px);line-height:1;letter-spacing:-.02em;color:#111;
}
.r-num .pct{font-size:.44em;}
.r-verdict{
  margin-top:2.6cqh;
  font-family:var(--f-gulim);font-weight:700;
  font-size:clamp(18px,5.2cqh,23px);line-height:1.35;
  letter-spacing:-.02em;color:#111;text-wrap:balance;
}
.r-sub{
  margin-top:1.4cqh;font-family:var(--f-gulim);font-weight:700;
  font-size:clamp(12px,3.4cqh,15px);line-height:1.5;
  letter-spacing:-.02em;color:#888;text-wrap:balance;
}

/* 버튼 : 캡처 영역 바깥 */
.r-actions{flex:none;display:flex;flex-direction:column;gap:10px;padding-top:14px;}
/* 메인 버튼 : 검정 solid (랜딩 시작 버튼과 동일 톤) */
.r-actions .btn{
  height:60px;font-family:var(--f-gulim);font-weight:700;font-size:20px;letter-spacing:0;
  color:#fff;background:#111;border:2px solid #111;border-radius:10px;
  box-shadow:none;text-shadow:none;transition:opacity .1s ease, transform .08s ease;
}
.r-actions .btn.sm{height:54px;font-size:18px;}
/* 보조 버튼 : 흰 배경 · 검정 테두리 */
.r-actions .btn.alt,.r-actions .btn.alt2{
  background:#fff;color:#111;
}
.r-actions .btn:active{transform:scale(.99);opacity:.9;}
.r-actions .note{
  text-align:center;font-family:var(--f-gulim);font-weight:700;font-size:12px;

  <!-- ============ 3. 로딩 ============ -->

<script>
/* =========================================================
   배경 데코 — 보케 원 + 하트/반짝이 (CSS 요소로 생성)
   가독성 마지노선 : 전부 opacity .3 이하
   ========================================================= */
const DECO = {
  landing:{
    bokeh:  { n:9,  min:70, max:230 },
    hearts: { n:11, min:16, max:52, colors:['#FF3D9E','#FF7AC8','#FF2E2E','#FFFFFF','#FF1E6E'] },
    sparks: { n:9,  chars:['✨','⭐','💫','❤','💛'] }
  },
};
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function paintDeco(host){
  const cfg = DECO[host.dataset.deco];
  if(!cfg || host.childElementCount) return;

  // 보케 원
  for(let i = 0; i < cfg.bokeh.n; i++){
    const size = rand(cfg.bokeh.min, cfg.bokeh.max);
    const d = document.createElement('div');
    d.className = 'bokeh';
    d.style.cssText =
      `width:${size}px;height:${size}px;left:${rand(-14,90)}%;top:${rand(-8,92)}%;` +
      `opacity:${rand(.16,.30).toFixed(2)}`;
    host.appendChild(d);
  }

  // 하트 (CSS로 그림)
  for(let i = 0; i < cfg.hearts.n; i++){
    const s = rand(cfg.hearts.min, cfg.hearts.max);
    const h = document.createElement('div');
    h.className = 'heart';
    h.style.cssText =
      `--s:${s.toFixed(0)}px;--c:${pick(cfg.hearts.colors)};--o:${rand(.14,.30).toFixed(2)};` +
      `left:${rand(-4,92)}%;top:${rand(-2,94)}%;opacity:${rand(.14,.30).toFixed(2)};` +
      `transform:rotate(${rand(-70,-20).toFixed(0)}deg);` +
      `animation:heartbeat ${rand(2.2,4.5).toFixed(1)}s infinite ease-in-out ${(-rand(0,3)).toFixed(1)}s`;
    host.appendChild(h);
  }

  // 반짝이
  for(let i = 0; i < cfg.sparks.n; i++){
    const s = document.createElement('span');
    s.className = 'spark';
    s.textContent = pick(cfg.sparks.chars);
    s.style.cssText =
      `left:${rand(-2,94)}%;top:${rand(-2,95)}%;font-size:${rand(16,42).toFixed(0)}px;` +
      `color:#FFF6A8;--o:${rand(.18,.30).toFixed(2)};--r:${rand(-30,30).toFixed(0)}deg;` +
      `animation-duration:${rand(1.8,4.2).toFixed(1)}s;animation-delay:-${rand(0,3).toFixed(1)}s;`;
    host.appendChild(s);
  }
}
document.querySelectorAll('.deco').forEach(paintDeco);

/* =========================================================
   조사 처리 — {name}{가} / {랑} / {는} / {를}
   이름 마지막 글자 받침 유무로 자동 선택
   ========================================================= */
const JOSA = { '가':['가','이'], '랑':['랑','이랑'], '는':['는','은'], '를':['를','을'], '와':['와','과'] };

function hasBatchim(ch){
  if(!ch) return false;
  const code = ch.charCodeAt(0);
  if(code < 0xAC00 || code > 0xD7A3) return false;   // 한글 음절이 아니면 받침 없음 취급
  return (code - 0xAC00) % 28 !== 0;
}

// 텍스트의 {name}·조사 토큰을 실제 값으로 치환
function t(str){
  const name = state.name || '걔';
  let out = str.replace(/\{name\}/g, name);
  out = out.replace(/(.)\{([가랑는를와])\}/g, (m, prev, key) => {
    const [noB, withB] = JOSA[key];
    return prev + (hasBatchim(prev) ? withB : noB);
  });
  return out;
}

const FINAL_Q = {

   출제 로직
   - 카테고리별 최소 1개씩(4개) + 나머지 1개는 무작위 = 5개
   - spicy 질문은 한 세트에 최대 1개
   - 순서 셔플 후 고정 질문을 맨 뒤에 붙임
   ========================================================= */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function pickQuestions(){
  const picked = [];
  const spicyLimit = 1;
  const canTake = q => !(q.spicy && picked.filter(p=>p.spicy).length >= spicyLimit);

  // 1) 카테고리별 1개씩
  CATEGORIES.forEach(cat => {
    const cands = shuffle(POOL.filter(q => q.category === cat && canTake(q)));
    if(cands.length) picked.push(cands[0]);
  });

  // 2) 남은 자리 무작위
  while(picked.length < RANDOM_COUNT){
    const rest = shuffle(POOL.filter(q => !picked.includes(q) && canTake(q)));
    if(!rest.length) break;
    picked.push(rest[0]);
  }

  return [...shuffle(picked), FINAL_Q];   // 고정 질문은 항상 마지막
}

/* 선택지 점수: 고정 질문은 자체 scores, 나머지는 0/1/2/3 */
function optionScore(q, i){
  return q.scores ? q.scores[i] : i;
}

/* =========================================================
   점수 계산 — 문항이 매번 달라도 만점은 항상 25점으로 고정
   ========================================================= */
function calcPercent(score){
  return Math.round(score / TOTAL_MAX * 100);
}

/* =========================================================
   결과 구간
   ========================================================= */
/* memes : 구간별 짤 후보. 렌더할 때마다 이 중 하나를 랜덤으로 보여준다.
   (폴더: ./assets/<구간>/01.jfif …) */
const RESULTS = [
  { max:20,  title:'평생 갈 사이',                    sub:'손절보다 결혼이 빠름',
    memes:memeList('./assets/0~20', 4) },
  { max:45,  title:'아직은 안전',                     sub:'근데 답장 속도는 좀 고쳐라',
    memes:memeList('./assets/21~45', 5) },
  { max:70,  title:'서로 눈치 보는 중',               sub:'먼저 연락 안 하면 이대로 자연소멸',
    memes:memeList('./assets/46~70', 5) },
  { max:90,  title:'근데 걔도 알걸요?',               sub:'둘 다 알면서 모른 척하는 중',
    memes:memeList('./assets/71~90', 2) },
  { max:100, title:'이미 끝났는데 인정만 안 한 상태', sub:'근데 이거 하고 있는 거 보면… 아직 미련은 있네',
    memes:memeList('./assets/91~100', 3) }
];

/* <folder>/01.jfif ~ <folder>/0N.jfif 경로 배열 생성 */
function memeList(folder, n){
  const arr = [];
  for(let i = 1; i <= n; i++) arr.push(`${folder}/${String(i).padStart(2,'0')}.jfif`);
  return arr;
}

function getResult(percent){
  return RESULTS.find(r => percent <= r.max) || RESULTS[RESULTS.length-1];
}

/* =========================================================
   화면 전환
   ========================================================= */
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  syncBackdrop(id);
}

/* 카드(#app) 배경을 현재 화면 배경색으로 맞춘다. 바깥 회색(body)은 CSS 유지 */
function syncBackdrop(id){
  const cs = getComputedStyle(document.getElementById(id));
  const bg = cs.getPropertyValue('--bg-screen').trim();
  document.getElementById('app').style.background = bg || '#fff';
}
syncBackdrop('screen-landing');

/* =========================================================
   랜딩 → 시작
   ========================================================= */
const nameInput = document.getElementById('nameInput');
const startBtn  = document.getElementById('startBtn');

function start(){
  state.name      = nameInput.value.trim();   // 비어 있으면 t()에서 '걔'로 대체
  state.questions = pickQuestions();
  state.answers   = [];
  state.index     = 0;
  state.score     = 0;
  show('screen-quiz');
  renderQuestion();
}

startBtn.addEventListener('click', start);
nameInput.addEventListener('keydown', e => { if(e.key === 'Enter') start(); });

/* =========================================================
   질문 화면
   ========================================================= */
const qNow   = document.getElementById('qNow');
const qTotal = document.getElementById('qTotal');
const qFill  = document.getElementById('qFill');
const qStage = document.getElementById('qStage');
const qText  = document.getElementById('qText');
const qOpts  = document.getElementById('qOpts');

let locked = false;   // 전환 중 중복 탭 방지

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* 친구 이름만 포인트 컬러로 강조해서 HTML 반환 */
function tHtml(str){
  const name = state.name || '걔';
  return escapeHtml(t(str))
    .split(escapeHtml(name))
    .join(`<span class="nm">${escapeHtml(name)}</span>`);
}

/* 질문이 정해진 줄 수를 넘지 않을 때까지 폰트 크기를 줄인다 */
function fitText(el, max = 27, min = 19, lines = 3){
  const lh = 1.45;
  for(let size = max; size >= min; size--){
    el.style.fontSize = size + 'px';
    if(el.scrollHeight <= Math.ceil(size * lh * lines) + 1) break;
  }
}

function renderQuestion(){
  const q = state.questions[state.index];

  qNow.textContent   = state.index + 1;
  qTotal.textContent = state.questions.length;
  qFill.style.width  = ((state.index + 1) / state.questions.length * 100) + '%';

  qText.innerHTML = tHtml(q.q);
  fitText(qText);

  qOpts.innerHTML = '';
  q.a.forEach((text, i) => {
    const li = document.createElement('li');
    li.className = 'opt';
    li.textContent = t(text);
    li.addEventListener('click', () => answer(q, i, li));
    qOpts.appendChild(li);
  });
}

function answer(q, i, el){
  if(locked) return;
  locked = true;
  el.classList.add('sel');
  state.answers.push(optionScore(q, i));
  state.index++;

  setTimeout(() => {
    if(state.index >= state.questions.length){   // 고정 질문까지 끝 → 로딩
      locked = false;
      finish();
      return;
    }
    qStage.classList.add('is-out');              // 나가기
    setTimeout(() => {
      renderQuestion();
      qStage.classList.remove('is-out');
      qStage.classList.add('is-in');             // 오른쪽에서 들어오기
      setTimeout(() => {
        qStage.classList.remove('is-in');
        locked = false;
      }, 20);
    }, 150);
  }, 110);
}

function finish(){
  state.score   = state.answers.reduce((a, b) => a + b, 0);
  state.percent = calcPercent(state.score);
  runLoading();
}

/* =========================================================
   로딩 — 총 2.5초, 문구 4개 순차 교체 (마지막 0.5초)
   ========================================================= */
const LOADING_STEPS = [
  { text:'카톡 답장 텀 분석 중…',        hold:540 },
  { text:'읽씹 횟수 대조 중…',           hold:500 },
  { text:'{name} 마음도 계산 중…',       hold:500 },
  { text:'결과 나옴 (도망가도 늦음)',    hold:480, last:true }
];

const loadText = document.getElementById('loadText');

function runLoading(){
  show('screen-loading');
  let step = 0;

  const paint = () => {
    const s = LOADING_STEPS[step];
    loadText.innerHTML = tHtml(s.text);
    loadText.classList.toggle('last', !!s.last);
    loadText.classList.add('is-in');
    setTimeout(() => loadText.classList.remove('is-in'), 20);

    setTimeout(() => {
      step++;
      if(step >= LOADING_STEPS.length){ renderResult(); return; }
      loadText.classList.add('is-out');
      setTimeout(() => { loadText.classList.remove('is-out'); paint(); }, 160);
    }, s.hold);
  };

  paint();
}

/* =========================================================
   결과 화면
   ========================================================= */
const card      = document.getElementById('result-card');
const rLabel    = document.getElementById('rLabel');
const rNum      = document.getElementById('rNum');
const rVerdict  = document.getElementById('rVerdict');
const rSub      = document.getElementById('rSub');

const rMeme = document.getElementById('rMeme');

function renderResult(){
  const r = getResult(state.percent);

  rLabel.innerHTML  = tHtml('{name}{와} 나의');
  rVerdict.textContent = r.title;
  rSub.textContent     = r.sub;
  rNum.textContent     = '0';

  // 구간별 짤 랜덤 1개 (없으면 자리 숨김)
  const memes = r.memes || [];
  if(memes.length){
    rMeme.src = encodeURI(memes[Math.floor(Math.random() * memes.length)]);
    rMeme.style.display = '';
  }else{
    rMeme.removeAttribute('src'); rMeme.style.display = 'none';
  }

  show('screen-result');
  countUp(state.percent);
}

/* 0 → 최종값 카운트업 (1초) */
function countUp(target){
  const dur = 1000, t0 = performance.now();
  const tick = now => {
    const p = Math.min((now - t0) / dur, 1);
    const eased = 1 - Math.pow(1 - p, 3);        // easeOutCubic
    rNum.textContent = Math.round(target * eased);
    if(p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

/* =========================================================
   공유 — 복사 / 이미지 저장 / 다시 하기
   ========================================================= */
const SITE_URL = '';   // 배포 주소를 넣으면 이 값이 쓰인다. 비워두면 현재 주소 자동 사용

function shareLink(){
  if(SITE_URL) return SITE_URL;
  return /^https?:$/.test(location.protocol) ? location.origin + location.pathname : '';
}

function shareText(){
  const head = state.name ? `${state.name}${hasBatchim(state.name.slice(-1)) ? '아' : '야'}, ` : '';
  const link = shareLink();
  return `${head}너랑 나 손절 위험도 ${state.percent}% 나왔는데 할 말 있어?${link ? ' ' + link : ''}`;
}

/* 토스트 */
const toastEl = document.getElementById('toast');
let toastTimer;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('on'), 1900);
}

/* 클립보드 (구형 브라우저·file:// 대비 fallback 포함) */
async function copyText(text){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){ /* fallback으로 */ }
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}

document.getElementById('shareBtn').addEventListener('click', async () => {
  const ok = await copyText(shareText());
  toast(ok ? t('복사됨! {name}한테 보내봐') : '복사 실패… 길게 눌러서 복사해줘');
});

/* html2canvas는 저장 버튼을 누를 때만 불러온다 */
function loadHtml2Canvas(){
  if(window.html2canvas) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload = res;
    s.onerror = rej;
    document.head.appendChild(s);
  });
}

const saveBtn = document.getElementById('saveBtn');
saveBtn.addEventListener('click', async () => {
  const label = saveBtn.textContent;
  saveBtn.textContent = '저장하는 중…';
  saveBtn.disabled = true;
  try{
    await loadHtml2Canvas();
    const canvas = await html2canvas(card, { scale: 3, backgroundColor: null, useCORS: true });
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '손절계산기_결과.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast('이미지 저장됨');
    }, 'image/png');
  }catch(e){
    toast('저장 실패… 스크린샷으로 찍어줘');
  }finally{
    saveBtn.textContent = label;
    saveBtn.disabled = false;
  }
});

/* 질문을 새로 뽑아 1번부터 다시 */
document.getElementById('retryBtn').addEventListener('click', () => {
  state.questions = pickQuestions();
  state.answers = [];
  state.index   = 0;
  state.score   = 0;
  locked = false;
  show('screen-quiz');
  renderQuestion();
});
</script>
